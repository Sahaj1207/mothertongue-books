<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F9FC" />
    <meta name="description" content="Original, illustrated children's books written in a child's own language: Telugu, Kannada and Marathi." />
    <title>MotherTongue Books</title>
    <meta property="og:title" content="MotherTongue Books" />
    <meta property="og:description" content="Picture books in your child's own language: Telugu, Kannada and Marathi." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme before the first paint, so Slate never flashes white.
      try {
        let theme = localStorage.getItem('theme')
        if (theme === 'night') theme = 'slate'
        if (theme === 'warm') localStorage.setItem('warm-light', '1')
        if (['clay', 'pop', 'kolam', 'slate'].includes(theme)) document.documentElement.dataset.theme = theme
        if (localStorage.getItem('warm-light')) document.documentElement.dataset.warm = ''
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Baloo+Tamma+2:wght@500;600;700&family=Baloo+Tammudu+2:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
