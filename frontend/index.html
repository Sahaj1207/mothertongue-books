    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint, so Slate never flashes white.
      try {
        let theme = localStorage.getItem('theme')
        if (theme === 'night') theme = 'slate'
        if (theme === 'warm') localStorage.setItem('warm-light', '1')
        if (['clay', 'pop', 'kolam', 'slate'].includes(theme)) document.documentElement.dataset.theme = theme
        if (localStorage.getItem('warm-light')) document.documentElement.dataset.warm = ''
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Baloo+Tamma+2:wght@500;600;700&family=Baloo+Tammudu+2:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Kannada:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&display=swap"
    />
